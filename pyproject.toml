[project]
name = "the-gang-goes-golfing"
version = "0.1.0"
description = "Backend API for The Gang Goes Golfing"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "supabase",
    "pydantic",
    "python-dotenv",
    "invoke>=3.0.3",
    "requests",
    # >=2.17 specifically for dcc.Loading's custom_spinner prop (added in
    # that release) -- components/spinner.py's golf swing loading icon
    # relies on it; an older dash installed already in a dev venv (pip
    # won't upgrade an unpinned-but-already-satisfied dependency on its
    # own) would silently ignore custom_spinner and fall back to the
    # default built-in spinner instead of erroring, which is exactly what
    # made the new spinner not show up the first time around.
    "dash>=2.17",
    "dash-bootstrap-components",
    "python-multipart",
    # Production WSGI server for the Dash/Flask frontend (see
    # Dockerfile.frontend) -- app.run(debug=True)'s built-in dev server
    # (still used for local `uv run python frontend/src/app.py`) isn't
    # meant to serve real traffic or run with debug mode reachable from
    # the internet.
    "gunicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "invoke",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]